<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trace Tracker — Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <script src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.min.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500&display=swap");

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #0a0e0f;
                --surface: #111618;
                --surface2: #181e20;
                --border: #1e2729;
                --accent: #e8a33d;
                --accent-dim: #e8a33d20;
                --accent-hover: #f2b65a;
                --text: #e8f0ee;
                --text-muted: #6b8880;
                --error: #ff5f5f;
                --mono: "JetBrains Mono", monospace;
                --sans: "IBM Plex Sans", sans-serif;

                --text-xs: 0.6875rem;
                --text-sm: 0.75rem;
                --text-base: 0.875rem;
                --text-md: 1rem;
                --text-lg: 1.25rem;

                --prose-text: #c4b8a8;
                --code-bg: #1a1206;
                --code-text: #f2c879;
                --code-border: #3a2a12;
                --pre-bg: #140d05;
                --pre-text: #e8d9b8;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                min-height: 100vh;
            }

            header {
                position: relative;
                z-index: 10;
                border-bottom: 1px solid var(--border);
                padding: 1rem 2rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: var(--bg);
            }

            .logo {
                font-family: var(--mono);
                font-size: var(--text-lg);
                font-weight: 700;
                color: var(--accent);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .logo::before {
                content: ">";
                color: var(--text-muted);
                font-weight: 400;
            }

            .logout-btn {
                font-family: var(--mono);
                font-size: var(--text-sm);
                color: var(--text-muted);
                background: transparent;
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 0.4rem 0.8rem;
                min-height: 2.75rem;
                display: inline-flex;
                align-items: center;
                cursor: pointer;
                transition: all 0.15s;
            }

            .logout-btn:hover {
                color: var(--error);
                border-color: var(--error);
            }

            .layout {
                position: relative;
                z-index: 1;
                display: grid;
                grid-template-columns: 1fr 340px;
                gap: 0;
                height: calc(100vh - 57px);
            }

            .main-panel {
                padding: 2rem;
                overflow-y: auto;
                border-right: 1px solid var(--border);
            }

            .sidebar {
                overflow-y: auto;
                padding: 1.5rem;
            }

            .section-label {
                font-family: var(--mono);
                font-size: var(--text-sm);
                font-weight: 700;
                letter-spacing: 1.5px;
                text-transform: uppercase;
                color: var(--text-muted);
                margin-bottom: 1rem;
            }

            .log-input {
                width: 100%;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1rem;
                color: var(--text);
                font-family: var(--mono);
                font-size: var(--text-base);
                line-height: 1.6;
                resize: vertical;
                min-height: 160px;
                outline: none;
                transition: border-color 0.15s;
            }

            .log-input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-dim);
            }
            .log-input::placeholder {
                color: var(--text-muted);
            }

            .analyze-btn {
                margin-top: 1rem;
                padding: 0.7rem 1.5rem;
                min-height: 2.75rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: var(--accent);
                color: var(--bg);
                border: none;
                border-radius: 6px;
                font-family: var(--mono);
                font-size: var(--text-base);
                font-weight: 700;
                cursor: pointer;
                letter-spacing: 0.5px;
                transition: all 0.15s;
            }

            .analyze-btn:hover {
                background: var(--accent-hover);
            }
            .analyze-btn:active {
                transform: scale(0.99);
            }
            .analyze-btn:disabled {
                opacity: 0.55;
                cursor: not-allowed;
                transform: none;
            }

            .result-area {
                margin-top: 2rem;
            }

            .result-box {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.5rem;
                display: none;
            }

            .result-box.visible {
                display: block;
            }

            .result-tabs {
                display: flex;
                flex-wrap: wrap;
                gap: 0;
                margin-bottom: 1rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
            }

            .result-tab {
                flex: 1;
                min-width: 6rem;
                padding: 0.6rem 0.5rem;
                min-height: 2.75rem;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                background: transparent;
                border: none;
                color: var(--text-muted);
                font-family: var(--mono);
                font-size: var(--text-sm);
                cursor: pointer;
                letter-spacing: 0.5px;
                transition: all 0.15s ease;
            }

            .result-tab.active {
                background: var(--accent-dim);
                color: var(--accent);
            }

            .result-tab:hover:not(.active) {
                color: var(--text);
                background: var(--surface2);
            }

            .loading-indicator {
                display: none;
                font-family: var(--mono);
                font-size: var(--text-base);
                color: var(--accent);
                margin-top: 1rem;
                animation: pulse 1.5s ease-in-out infinite;
            }

            .loading-indicator.visible {
                display: block;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.4;
                }
            }

            .history-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.75rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 0.9rem;
                margin-bottom: 0.75rem;
                cursor: pointer;
                transition: border-color 0.15s;
            }

            .history-item:hover,
            .history-item:focus-visible {
                border-color: var(--accent);
            }

            .history-item:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            .history-item-main {
                min-width: 0;
                flex: 1;
            }

            .history-error-name {
                font-family: var(--mono);
                font-size: var(--text-base);
                color: var(--accent);
                margin-bottom: 0.3rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .history-date {
                font-family: var(--mono);
                font-size: var(--text-xs);
                color: var(--text-muted);
            }

            .history-delete {
                flex-shrink: 0;
                min-width: 3.75rem;
                min-height: 2.75rem;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                text-align: right;
                background: transparent;
                border: none;
                color: var(--text-muted);
                cursor: pointer;
                font-family: var(--mono);
                font-size: var(--text-sm);
                padding: 0;
                transition: color 0.15s;
            }

            .history-delete:hover {
                color: var(--error);
            }

            .history-delete.armed {
                color: var(--error);
                font-weight: 700;
            }

            .history-delete:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .load-more-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                padding: 0.6rem;
                min-height: 2.75rem;
                background: transparent;
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text-muted);
                font-family: var(--mono);
                font-size: var(--text-sm);
                letter-spacing: 0.5px;
                cursor: pointer;
                transition: all 0.15s;
            }

            .load-more-btn:hover {
                color: var(--accent);
                border-color: var(--accent);
            }

            .load-more-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .load-more-btn[hidden] {
                display: none;
            }

            .empty-history {
                font-family: var(--mono);
                font-size: var(--text-sm);
                color: var(--text-muted);
                text-align: center;
                padding: 2rem 0;
            }

            .error-msg {
                font-family: var(--mono);
                font-size: var(--text-sm);
                color: var(--error);
                margin-top: 0.75rem;
                padding: 0.6rem 0.9rem;
                border: 1px solid #ff5f5f30;
                border-radius: 6px;
                background: #ff5f5f08;
                display: none;
            }

            .error-msg.visible {
                display: block;
            }

            .error-msg.info {
                color: var(--text-muted);
                border-color: var(--border);
                background: var(--surface);
            }

            .scope-note {
                font-family: var(--mono);
                font-size: var(--text-xs);
                color: var(--text-muted);
                margin: -0.6rem 0 1rem;
            }

            .result-panel {
                display: none;
                max-width: 68ch;
                font-family: var(--mono);
                font-size: var(--text-base);
                line-height: 1.7;
                word-break: break-word;
                color: var(--text);
            }

            .result-panel.active {
                display: block;
            }

            .result-panel h1,
            .result-panel h2,
            .result-panel h3 {
                color: var(--accent);
                font-family: var(--mono);
                font-weight: 700;
                font-size: var(--text-md);
                margin: 1.2rem 0 0.5rem;
                letter-spacing: 0.3px;
            }

            .result-panel h1:first-child,
            .result-panel h2:first-child,
            .result-panel h3:first-child {
                margin-top: 0;
            }

            .result-panel > p:first-child {
                font-size: var(--text-base);
                line-height: 1.8;
                color: var(--text);
                margin-bottom: 1rem;
            }

            .result-panel p {
                font-size: var(--text-base);
                line-height: 1.8;
                margin-bottom: 1rem;
                color: var(--prose-text);
            }

            .result-panel strong {
                color: var(--accent);
                font-weight: 700;
            }

            .result-panel code {
                font-family: var(--mono);
                font-size: var(--text-sm);
                background: var(--code-bg);
                padding: 0.15rem 0.4rem;
                border-radius: 4px;
                color: var(--code-text);
                border: 1px solid var(--code-border);
            }

            .result-panel pre {
                background: var(--pre-bg);
                border: 1px solid var(--code-border);
                border-top: 2px solid var(--accent);
                border-radius: 6px;
                padding: 1.1rem 1rem;
                overflow-x: auto;
                margin: 1rem 0;
            }

            .result-panel pre code {
                background: transparent;
                padding: 0;
                color: var(--pre-text);
                border: none;
                font-size: var(--text-sm);
            }

            .result-panel .hljs-keyword,
            .result-panel .hljs-built_in,
            .result-panel .hljs-literal {
                color: var(--accent);
                font-weight: 700;
            }

            .result-panel .hljs-title,
            .result-panel .hljs-title.function_,
            .result-panel .hljs-title.class_ {
                color: var(--code-text);
            }

            .result-panel .hljs-string,
            .result-panel .hljs-doctag {
                color: #a8c98a;
            }

            .result-panel .hljs-number {
                color: #e8846b;
            }

            .result-panel .hljs-comment {
                color: var(--text-muted);
                font-style: italic;
            }

            .result-panel .hljs-params,
            .result-panel .hljs-attr {
                color: var(--pre-text);
            }

            .result-panel blockquote {
                margin: 1rem 0;
                padding-left: 1rem;
                color: var(--text-muted);
                font-style: italic;
            }

            .result-panel ol,
            .result-panel ul {
                margin-bottom: 1rem;
                font-size: var(--text-base);
                line-height: 1.8;
                color: var(--prose-text);
            }

            .result-panel ol {
                padding-left: 1.4rem;
            }

            .result-panel ol li::marker {
                color: var(--accent);
                font-weight: 700;
            }

            .result-panel ul {
                list-style: none;
                padding-left: 0;
            }

            .result-panel ul li {
                position: relative;
                padding-left: 1.4rem;
            }

            .result-panel ul li::before {
                content: "→";
                position: absolute;
                left: 0;
                color: var(--accent);
                font-weight: 700;
            }

            .result-panel li {
                margin-bottom: 0.4rem;
            }

            @media (max-width: 768px) {
                .layout {
                    grid-template-columns: 1fr;
                    height: auto;
                    min-height: calc(100vh - 57px);
                }

                .main-panel {
                    border-right: none;
                    border-bottom: 1px solid var(--border);
                }

                .sidebar {
                    max-height: 60vh;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo">trace-tracker</div>
            <button class="logout-btn" onclick="logout()">logout</button>
        </header>

        <div class="layout">
            <div class="main-panel">
                <p class="section-label">analyze error</p>
                <p class="scope-note">
                    Explains Python exceptions we recognize. Anything outside that list is declined, not guessed at.
                </p>

                <textarea
                    id="log-input"
                    class="log-input"
                    placeholder="Paste your stack trace here...&#10;&#10;Traceback (most recent call last):&#10;  File 'main.py', line 4&#10;ZeroDivisionError: division by zero"
                ></textarea>

                <div id="analyze-error" class="error-msg" role="alert"></div>

                <button
                    id="analyze-btn"
                    class="analyze-btn"
                    onclick="analyzeLog()"
                >
                    analyze →
                </button>

                <div class="result-area">
                    <div id="loading" class="loading-indicator">
                        analyzing your error...
                    </div>
                    <div id="result-box" class="result-box">
                        <div id="result-tabs" class="result-tabs"></div>
                        <div id="result-panels"></div>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <p class="section-label">history</p>
                <div id="history-error" class="error-msg" role="alert"></div>
                <div id="history-list">
                    <p class="empty-history">no history yet</p>
                </div>
                <button
                    id="history-load-more"
                    class="load-more-btn"
                    onclick="loadMoreHistory()"
                    hidden
                >
                    load more ↓
                </button>
            </div>
        </div>

        <script>
            const token = localStorage.getItem("token");
            if (!token) window.location.href = "/";

            function getHeaders() {
                return {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`,
                };
            }

            function escapeHtmlAttr(str) {
                return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
            }

            function logout() {
                localStorage.removeItem("token");
                window.location.href = "/";
            }

            function splitIntoSections(markdown) {
                const headerRe = /^##\s+(.+?)\s*$/;
                const sections = [];
                let current = null;

                for (const line of markdown.split("\n")) {
                    const headerMatch = line.match(headerRe);
                    if (headerMatch) {
                        current = { title: headerMatch[1].trim(), lines: [] };
                        sections.push(current);
                    } else if (current) {
                        current.lines.push(line);
                    }
                }

                return sections
                    .map((s) => ({ title: s.title, content: s.lines.join("\n").trim() }))
                    .filter((s) => s.title && s.content);
            }

            function highlightCodeBlocks(container) {
                if (typeof hljs === "undefined") return;
                container.querySelectorAll("pre code").forEach((block) => {
                    hljs.highlightElement(block);
                });
            }

            function renderAnalysis(markdown) {
                const tabsEl = document.getElementById("result-tabs");
                const panelsEl = document.getElementById("result-panels");
                tabsEl.innerHTML = "";
                panelsEl.innerHTML = "";

                const sections = splitIntoSections(markdown);

                if (sections.length < 2) {
                    tabsEl.hidden = true;
                    panelsEl.innerHTML = `<div class="result-panel active">${marked.parse(markdown)}</div>`;
                    highlightCodeBlocks(panelsEl);
                    return;
                }

                tabsEl.hidden = false;
                sections.forEach((section, index) => {
                    const tabBtn = document.createElement("button");
                    tabBtn.type = "button";
                    tabBtn.className = "result-tab" + (index === 0 ? " active" : "");
                    tabBtn.textContent = section.title;
                    tabBtn.onclick = () => showResultTab(index);
                    tabsEl.appendChild(tabBtn);

                    const panel = document.createElement("div");
                    panel.className = "result-panel" + (index === 0 ? " active" : "");
                    panel.innerHTML = marked.parse(section.content);
                    panelsEl.appendChild(panel);
                });

                highlightCodeBlocks(panelsEl);
            }

            function showResultTab(index) {
                document
                    .querySelectorAll("#result-tabs .result-tab")
                    .forEach((btn, i) => btn.classList.toggle("active", i === index));
                document
                    .querySelectorAll("#result-panels .result-panel")
                    .forEach((panel, i) => panel.classList.toggle("active", i === index));
            }

            async function analyzeLog() {
                const log = document.getElementById("log-input").value.trim();
                const errorEl = document.getElementById("analyze-error");
                const loadingEl = document.getElementById("loading");
                const resultBox = document.getElementById("result-box");
                const analyzeBtn = document.getElementById("analyze-btn");

                if (analyzeBtn.disabled) return;

                if (!log) {
                    errorEl.classList.remove("info");
                    errorEl.textContent = "Paste a stack trace before analyzing.";
                    errorEl.classList.add("visible");
                    return;
                }

                errorEl.classList.remove("visible", "info");
                resultBox.classList.remove("visible");
                loadingEl.classList.add("visible");
                analyzeBtn.disabled = true;

                try {
                    const response = await fetch("/search-log/", {
                        method: "POST",
                        headers: getHeaders(),
                        body: JSON.stringify({ log }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        renderAnalysis(data);
                        resultBox.classList.add("visible");
                        loadHistory();
                    } else if (response.status === 404) {
                        errorEl.textContent =
                            data.message ||
                            "We don't recognize this error yet, so we won't guess at an explanation.";
                        errorEl.classList.add("visible", "info");
                    } else {
                        errorEl.textContent =
                            data.message || "Something went wrong while analyzing that log.";
                        errorEl.classList.add("visible");
                    }
                } catch (err) {
                    errorEl.textContent = "Failed to connect to server. Check your connection and try again.";
                    errorEl.classList.add("visible");
                } finally {
                    loadingEl.classList.remove("visible");
                    analyzeBtn.disabled = false;
                }
            }

            const HISTORY_PAGE_SIZE = 10;
            let historyPage = 1;
            let historyLoadingMore = false;

            async function loadHistory() {
                const historyError = document.getElementById("history-error");
                const loadMoreBtn = document.getElementById("history-load-more");
                historyPage = 1;
                try {
                    const response = await fetch(
                        `/history/?page=${historyPage}&limit=${HISTORY_PAGE_SIZE}`,
                        { headers: getHeaders() },
                    );
                    if (!response.ok) throw new Error("failed to load history");
                    const data = await response.json();
                    historyError.classList.remove("visible");
                    renderHistory(data, false);
                    loadMoreBtn.hidden = data.length < HISTORY_PAGE_SIZE;
                } catch (err) {
                    historyError.textContent = "Couldn't load history.";
                    historyError.classList.add("visible");
                    loadMoreBtn.hidden = true;
                }
            }

            async function loadMoreHistory() {
                if (historyLoadingMore) return;
                const historyError = document.getElementById("history-error");
                const loadMoreBtn = document.getElementById("history-load-more");
                const nextPage = historyPage + 1;

                historyLoadingMore = true;
                loadMoreBtn.disabled = true;
                loadMoreBtn.textContent = "loading…";

                try {
                    const response = await fetch(
                        `/history/?page=${nextPage}&limit=${HISTORY_PAGE_SIZE}`,
                        { headers: getHeaders() },
                    );
                    if (!response.ok) throw new Error("failed to load more history");
                    const data = await response.json();
                    historyPage = nextPage;
                    historyError.classList.remove("visible");
                    renderHistory(data, true);
                    loadMoreBtn.hidden = data.length < HISTORY_PAGE_SIZE;
                } catch (err) {
                    historyError.textContent = "Couldn't load more history.";
                    historyError.classList.add("visible");
                } finally {
                    historyLoadingMore = false;
                    loadMoreBtn.disabled = false;
                    loadMoreBtn.textContent = "load more ↓";
                }
            }

            function renderHistory(items, append) {
                const list = document.getElementById("history-list");

                if (!append) {
                    list.innerHTML = "";
                }

                if (!items || items.length === 0) {
                    if (!append) {
                        list.innerHTML =
                            '<p class="empty-history">no history yet</p>';
                    }
                    return;
                }

                const html = items
                    .map(
                        (item) => `
                <div
                    class="history-item"
                    role="button"
                    tabindex="0"
                    onclick="showHistoryItem(${item.id})"
                    onkeydown="handleHistoryItemKeydown(event, ${item.id})"
                >
                    <div class="history-item-main">
                        <div class="history-error-name" title="${escapeHtmlAttr(item.error_name)}">${item.error_name}</div>
                        <div class="history-date">${new Date(item.create_date).toLocaleDateString()}</div>
                    </div>
                    <button class="history-delete" onclick="deleteItem(event, ${item.id})">delete</button>
                </div>
            `,
                    )
                    .join("");

                list.insertAdjacentHTML("beforeend", html);
            }

            function handleHistoryItemKeydown(event, id) {
                if (event.target.closest(".history-delete")) return;
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    showHistoryItem(id);
                }
            }

            async function showHistoryItem(id) {
                const errorEl = document.getElementById("analyze-error");
                try {
                    const response = await fetch(`/history/${id}`, {
                        headers: getHeaders(),
                    });
                    if (!response.ok) throw new Error("failed to load item");
                    const data = await response.json();
                    const resultBox = document.getElementById("result-box");
                    errorEl.classList.remove("visible");
                    renderAnalysis(data.ia_response);
                    resultBox.classList.add("visible");
                } catch (err) {
                    errorEl.textContent = "Couldn't load that analysis.";
                    errorEl.classList.add("visible");
                }
            }

            function deleteItem(event, id) {
                event.stopPropagation();
                const btn = event.currentTarget;

                if (btn.dataset.armed !== "true") {
                    btn.dataset.armed = "true";
                    btn.textContent = "confirm?";
                    btn.classList.add("armed");
                    clearTimeout(btn._disarmTimer);
                    btn._disarmTimer = setTimeout(() => disarmDelete(btn), 4000);
                    return;
                }

                clearTimeout(btn._disarmTimer);
                performDelete(id, btn);
            }

            function disarmDelete(btn) {
                btn.dataset.armed = "false";
                btn.textContent = "delete";
                btn.classList.remove("armed");
            }

            async function performDelete(id, btn) {
                const historyError = document.getElementById("history-error");
                btn.disabled = true;
                try {
                    const response = await fetch(`/history/${id}`, {
                        method: "DELETE",
                        headers: getHeaders(),
                    });
                    if (!response.ok) throw new Error("failed to delete item");
                    loadHistory();
                } catch (err) {
                    historyError.textContent = "Couldn't delete that entry — try again.";
                    historyError.classList.add("visible");
                    disarmDelete(btn);
                    btn.disabled = false;
                }
            }

            loadHistory();
        </script>
    </body>
</html>
