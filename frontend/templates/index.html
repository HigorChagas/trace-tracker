<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trace Tracker</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
        <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/json-enc.js" defer></script>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500&display=swap");

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #0a0e0f;
                --surface: #111618;
                --surface2: #181e20;
                --border: #1e2729;
                --accent: #e8a33d;
                --accent-dim: #e8a33d20;
                --accent-hover: #f2b65a;
                --text: #e8f0ee;
                --text-muted: #6b8880;
                --error: #ff5f5f;
                --mono: "JetBrains Mono", monospace;
                --sans: "IBM Plex Sans", sans-serif;

                --text-xs: 0.6875rem;
                --text-sm: 0.75rem;
                --text-base: 0.875rem;
                --text-md: 1rem;
                --text-lg: 1.25rem;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .bg-glow {
                position: fixed;
                width: 600px;
                height: 600px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    #e8a33d10 0%,
                    transparent 70%
                );
                top: -200px;
                right: -200px;
                pointer-events: none;
            }

            .container {
                position: relative;
                z-index: 1;
                width: 100%;
                max-width: 420px;
                padding: 1.5rem;
            }

            .logo {
                font-family: var(--mono);
                font-size: var(--text-lg);
                font-weight: 700;
                color: var(--accent);
                letter-spacing: -0.5px;
                margin-bottom: 2.5rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .logo::before {
                content: ">";
                color: var(--text-muted);
                font-weight: 400;
            }

            .tabs {
                display: flex;
                gap: 0;
                margin-bottom: 2rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
            }

            .tab {
                flex: 1;
                padding: 0.65rem;
                min-height: 2.75rem;
                display: flex;
                align-items: center;
                justify-content: center;
                background: transparent;
                border: none;
                color: var(--text-muted);
                font-family: var(--mono);
                font-size: var(--text-base);
                cursor: pointer;
                transition: all 0.15s ease;
                letter-spacing: 0.5px;
            }

            .tab.active {
                background: var(--accent-dim);
                color: var(--accent);
            }

            .tab:hover:not(.active) {
                color: var(--text);
                background: var(--surface2);
            }

            .form-panel {
                display: none;
            }

            .form-panel.active {
                display: block;
            }

            .field {
                margin-bottom: 1rem;
            }

            .field label {
                display: block;
                font-family: var(--mono);
                font-size: var(--text-sm);
                font-weight: 700;
                color: var(--text-muted);
                letter-spacing: 1.5px;
                text-transform: uppercase;
                margin-bottom: 0.4rem;
            }

            .field input {
                width: 100%;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 0.7rem 0.9rem;
                color: var(--text);
                font-family: var(--mono);
                font-size: var(--text-base);
                outline: none;
                transition: border-color 0.15s ease;
            }

            .field input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-dim);
            }

            .field input::placeholder {
                color: var(--text-muted);
            }

            .btn-primary {
                width: 100%;
                padding: 0.75rem;
                min-height: 2.75rem;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--accent);
                color: var(--bg);
                border: none;
                border-radius: 6px;
                font-family: var(--mono);
                font-size: var(--text-base);
                font-weight: 700;
                cursor: pointer;
                letter-spacing: 0.5px;
                transition: all 0.15s ease;
                margin-top: 0.5rem;
            }

            .btn-primary:hover {
                background: var(--accent-hover);
            }

            .btn-primary:active {
                transform: scale(0.99);
            }

            .btn-primary:disabled {
                opacity: 0.55;
                cursor: not-allowed;
                transform: none;
            }

            .field-hint {
                font-family: var(--mono);
                font-size: var(--text-xs);
                color: var(--text-muted);
                margin-top: 0.4rem;
            }

            .error-msg {
                font-family: var(--mono);
                font-size: var(--text-sm);
                color: var(--error);
                margin-top: 1rem;
                padding: 0.6rem 0.9rem;
                border: 1px solid #ff5f5f30;
                border-radius: 6px;
                background: #ff5f5f08;
                display: none;
            }

            .error-msg.visible {
                display: block;
            }

            .success-msg {
                font-family: var(--mono);
                font-size: var(--text-sm);
                color: var(--accent);
                margin-bottom: 1rem;
                padding: 0.6rem 0.9rem;
                border: 1px solid #e8a33d30;
                border-radius: 6px;
                background: #e8a33d08;
                display: none;
            }

            .success-msg.visible {
                display: block;
            }

            .footer-text {
                font-size: var(--text-xs);
                color: var(--text-muted);
                text-align: center;
                margin-top: 2rem;
                font-family: var(--mono);
            }

            .htmx-indicator {
                display: none;
            }

            .htmx-request .htmx-indicator {
                display: inline;
            }

            @media (max-width: 480px) {
                .container {
                    padding: 1.5rem 1rem;
                }
            }

            @media (max-height: 700px) {
                body {
                    align-items: flex-start;
                    padding: 2rem 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="bg-glow"></div>

        <div class="container">
            <div class="logo">trace-tracker</div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">
                    login
                </button>
                <button class="tab" onclick="switchTab('register')">
                    register
                </button>
            </div>

            <div id="login-panel" class="form-panel active">
                <div id="login-success" class="success-msg" aria-live="polite"></div>
                <form
                    hx-post="/login/"
                    hx-swap="none"
                    hx-on::after-request="handleLogin(event)"
                    hx-ext="json-enc"
                    hx-disabled-elt="find button[type=submit]"
                >
                    <div class="field">
                        <label for="login-email">email</label>
                        <input
                            id="login-email"
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="login-password">password</label>
                        <input
                            id="login-password"
                            type="password"
                            name="password"
                            placeholder="••••••••"
                            maxlength="100"
                            autocomplete="current-password"
                            required
                        />
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>sign in</span>
                        <span class="htmx-indicator"> ...</span>
                    </button>
                    <div id="login-error" class="error-msg" role="alert"></div>
                </form>
            </div>

            <div id="register-panel" class="form-panel">
                <form
                    hx-post="/register/"
                    hx-swap="none"
                    hx-on::after-request="handleRegister(event)"
                    hx-ext="json-enc"
                    hx-disabled-elt="find button[type=submit]"
                >
                    <div class="field">
                        <label for="register-name">name</label>
                        <input
                            id="register-name"
                            type="text"
                            name="name"
                            placeholder="Your name"
                            autocomplete="name"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="register-email">email</label>
                        <input
                            id="register-email"
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="register-password">password</label>
                        <input
                            id="register-password"
                            type="password"
                            name="password"
                            placeholder="••••••••"
                            minlength="5"
                            maxlength="100"
                            autocomplete="new-password"
                            aria-describedby="register-password-hint"
                            required
                        />
                        <p id="register-password-hint" class="field-hint">min. 5 characters</p>
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>create account</span>
                        <span class="htmx-indicator"> ...</span>
                    </button>
                    <div id="register-error" class="error-msg" role="alert"></div>
                </form>
            </div>

            <p class="footer-text">explains errors we recognize — nothing guessed</p>
        </div>

        <script>
            function switchTab(tab) {
                document
                    .querySelectorAll(".tab")
                    .forEach((t) => t.classList.remove("active"));
                document
                    .querySelectorAll(".form-panel")
                    .forEach((p) => p.classList.remove("active"));
                document
                    .querySelector(
                        `.tab:${tab === "login" ? "first-child" : "last-child"}`,
                    )
                    .classList.add("active");
                document.getElementById(`${tab}-panel`).classList.add("active");
                if (tab === "register") {
                    document
                        .getElementById("login-success")
                        .classList.remove("visible");
                }
            }

            function handleLogin(event) {
                const response = event.detail.xhr;
                const errorEl = document.getElementById("login-error");
                if (response.status === 200) {
                    const data = JSON.parse(response.responseText);
                    localStorage.setItem("token", data.access_token);
                    window.location.href = "/dashboard";
                } else {
                    document
                        .getElementById("login-success")
                        .classList.remove("visible");
                    try {
                        const data = JSON.parse(response.responseText);
                        errorEl.textContent = data.message || "Login failed";
                    } catch {
                        errorEl.textContent = "Login failed";
                    }
                    errorEl.classList.add("visible");
                }
            }

            function handleRegister(event) {
                const response = event.detail.xhr;
                const errorEl = document.getElementById("register-error");
                if (response.status === 201) {
                    switchTab("login");
                    const successEl = document.getElementById("login-success");
                    successEl.textContent = "Account created — sign in below.";
                    successEl.classList.add("visible");
                } else {
                    try {
                        const data = JSON.parse(response.responseText);
                        errorEl.textContent = data.message || "Registration failed";
                    } catch {
                        errorEl.textContent = "Registration failed";
                    }
                    errorEl.classList.add("visible");
                }
            }
        </script>
    </body>
</html>
